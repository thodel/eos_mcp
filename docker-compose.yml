services:
  eos-mcp:
    build: .
    image: eos-mcp:latest
    container_name: eos-mcp
    restart: unless-stopped
    ports:
      # Published on all interfaces by default. The server has no authentication, so
      # if nginx (or another proxy) fronts it, set EOS_BIND=127.0.0.1 to make it
      # unreachable directly from the network.
      - "${EOS_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - /home/dh/eos_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      # The server answers on its *public* path so nginx can proxy_pass without
      # rewriting. Change this together with the nginx location block; the two
      # must agree exactly or every request 404s.
      - EOS_HTTP_PATH=${EOS_HTTP_PATH:-/mcp/eos/mcp}
    healthcheck:
      # A plain TCP connect: opening the endpoint would start an MCP session and
      # abandon it every 30 seconds.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
